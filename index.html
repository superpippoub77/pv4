    <!-- API Configuration -->
    <script>
        // Configurazione dell'ambiente
        window.APP_CONFIG = {
            API_BASE_URL: (() => {
                const host = window.location.hostname;
                const port = window.location.port;
                
                // In sviluppo locale
                if (host === 'localhost' || host === '127.0.0.1') {
                    return port === '8000' ? '/api' : `http://localhost:8000/api`;
                }
                
                // In produzione - personalizza qui il path delle API
                if (host === 'www.filippomorano.com' || host === 'filippomorano.com') {
                    // Usa il path relativo all'interno del progetto
                    return './api';  // Relativo alla cartella del progetto
                }
                
                // Default
                return '/api';
            })()
        };
        console.log('API Base URL:', window.APP_CONFIG.API_BASE_URL);
    </script>

    <script>
        const defaultLang = 'it';

        async function initializeEditor() {
            // Controlla se l'editor è già inizializzato
            if (window.editor) {
                console.log("Editor già inizializzato");
                return; // Non ricreare nulla
            }

            // Inizializza loginManager
            loginManager = new LoginManager({
                userDataUrl: 'data/users.json',
                onLoginSuccess: async (username) => {
                    // Controlla di nuovo se l'editor esiste
                    if (!window.editor) {
                        setDefaultDate('workoutDate');
                        storage = new Storage(username);
                        window.editor = new SchemaEditor(configuration, menuData, username, storage);
                        await window.editor.initialize();
                        
                        // Inizializza profileManager per il profilo utente
                        if (typeof APIClient !== 'undefined' && typeof ProfileManager !== 'undefined') {
                            window.apiClient = new APIClient(window.APP_CONFIG.API_BASE_URL);
                            window.profileManager = new ProfileManager(window.apiClient);
                            
                            // Effettua il login automatico tramite le API JWT per accedere al profilo
                            // Usa le credenziali di default (admin/1234) come fallback
                            try {
                                await window.apiClient.login(username || 'admin', '1234');
                                console.log('Login JWT automatico riuscito per:', username);
                            } catch (error) {
                                console.log('Login JWT fallito, il profilo potrebbe non essere disponibile:', error.message);
                                // Continua comunque, il profilo semplicemente non sarà disponibile
                            }
                        }

                        const langSelector = document.getElementById('languageSelector');
                        langSelector.value = defaultLang;
                        setLanguage(defaultLang);

                        langSelector.addEventListener('change', (event) => {
                            setLanguage(event.target.value);
                            translateElements(event.target.value);
                        });
                    }
                },
                onLogoutSuccess: () => {
                    if (window.editor) {
                        window.editor.handleLogoutSuccess();
                        window.editor = null; // Permette di reinizializzare dopo il logout
                    }
                }
            });

            // Listener per esportazione PDF
            const exportBtn = document.getElementById('exportPdfBtn');
            if (exportBtn && !exportBtn.dataset.listenerAdded) {
                exportBtn.addEventListener('click', () => {
                    if (window.editor && window.editor.exportWorkoutToPDF) {
                        window.editor.exportWorkoutToPDF();
                    } else {
                        alert('Errore: La funzione di esportazione non è stata caricata correttamente.');
                    }
                });
                exportBtn.dataset.listenerAdded = "true"; // evita di aggiungere listener duplicati
            }

            // // Listener per DataVolley cheatsheet PDF (scegli formato)
            // const exportDVBtn = document.getElementById('exportDataVolleyBtn');
            // if (exportDVBtn && !exportDVBtn.dataset.listenerAdded) {

            //         if (window.editor && window.editor.exportDataVolleyCheatsheet) {
            //             // Chiedi formato all'utente
            //             let mode = prompt("Formato PDF: scrivi 'compact' per versione compatta, 'extended' per versione estesa, o 'scout' per il foglio scout con tabella giocatori (default: extended)", "extended");
            //             if (!mode) mode = 'extended';
            //             if (String(mode).toLowerCase() === 'scout' || String(mode).toLowerCase() === 'scoutsheet') {
            //                 let boxes = prompt('Numero di caselle per fondamentale (es: 20)', '20');
            //                 boxes = parseInt(boxes, 10);
            //                 if (isNaN(boxes) || boxes <= 0) boxes = 20;
            //                 const interactive = prompt("Aprire versione compilabile in-browser? (s/n)", 'n');
            //                 const interactiveFlag = (String(interactive || '').toLowerCase() === 's');
            //                 window.editor.exportDataVolleyCheatsheet(mode, { boxCount: boxes, interactive: interactiveFlag });
            //             } else {
            //                 window.editor.exportDataVolleyCheatsheet(mode);
            //             }
            //         } else {
